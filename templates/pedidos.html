<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Tienda Genérica No.15</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/productos">Productos</a>
                <a class="nav-link active" href="/pedidos">Pedidos</a>
                <a class="nav-link text-danger" href="/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Colección de Pedidos</h2>
        <hr>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Registrar Nuevo Pedido</div>
            <div class="card-body">
                <form action="/pedidos/crear" method="POST" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="cliente" class="form-control" placeholder="Nombre del Cliente" required>
                    </div>
                    <div class="col-md-4">
                        <select name="producto_id" class="form-select" required>
                            <option value="" disabled selected>Selecciona un Producto</option>
                            {% for prod in productos %}
                                <option value="{{ prod._id }}">{{ prod.nombre }} - ${{ prod.precio }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="cantidad" class="form-control" placeholder="Cantidad" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Pedir</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID Pedido</th>
                    <th>Cliente</th>
                    <th>Producto Relacionado</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for pedido in pedidos %}
                <tr>
                    <td><code>{{ pedido._id }}</code></td>
                    <form action="/pedidos/editar/{{ pedido._id }}" method="POST">
                        <td><input type="text" name="cliente" value="{{ pedido.cliente }}" class="form-control form-control-sm" required></td>
                        <td>
                            <select name="producto_id" class="form-select form-select-sm" required>
                                {% for prod in productos %}
                                    <option value="{{ prod._id }}" {% if prod._id == pedido.producto_id %}selected{% endif %}>{{ prod.nombre }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="number" name="cantidad" value="{{ pedido.cantidad }}" class="form-control form-control-sm" required></td>
                        <td>
                            <button type="submit" class="btn btn-warning btn-sm">Actualizar</button>
                            <a href="/pedidos/eliminar/{{ pedido._id }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Cancelar este pedido?')">Eliminar</a>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
