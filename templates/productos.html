<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Tienda Genérica No.15</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/productos">Productos</a>
                <a class="nav-link" href="/pedidos">Pedidos</a>
                <a class="nav-link text-danger" href="/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Colección de Productos</h2>
        <hr>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white">Añadir Nuevo Producto</div>
            <div class="card-body">
                <form action="/productos/crear" method="POST" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="nombre" class="form-control" placeholder="Nombre del Producto" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio ($)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="stock" class="form-control" placeholder="Stock" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID Documento (MongoDB)</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for producto in productos %}
                <tr>
                    <td><code>{{ producto._id }}</code></td>
                    <form action="/productos/editar/{{ producto._id }}" method="POST">
                        <td><input type="text" name="nombre" value="{{ producto.nombre }}" class="form-control form-control-sm" required></td>
                        <td><input type="number" step="0.01" name="precio" value="{{ producto.precio }}" class="form-control form-control-sm" required></td>
                        <td><input type="number" name="stock" value="{{ producto.stock }}" class="form-control form-control-sm" required></td>
                        <td>
                            <button type="submit" class="btn btn-warning btn-sm">Actualizar</button>
                            <a href="/productos/eliminar/{{ producto._id }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar este documento?')">Eliminar</a>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
